<!DOCTYPE html>
<html>
    <head>
        <title>SpendWise</title>
        <link rel="stylesheet" href="style.css">
    </head>
<body>
    <div class="heading">
    <h1 id="head">My Budget Tracker</h1>
    <p>Track your income and expenses in one place.</p>
    </div>
    
    <section class="add-expense">
        <h2>Add Expense</h2>
        <label>The Expense Name</label>
        <input type="text" placeholder="Enter your name">

        <label>The Ammount</label>
        <input type="text" placeholder="Enter the amount">

        <label>The Category</label>
        <input type="text" placeholder="Enter the category">
    </section>
    
    <section class="your-expense">
        <h2>Your Expenses</h2>
        <label>Your Expenses</label>
        <input type="text" placeholder="No Expenses yet">
    </section>
</body>
</html>
